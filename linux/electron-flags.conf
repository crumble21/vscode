# Electron launch flags, one per line. On Arch, linked as both ~/.config/codium-flags.conf
# (read by /usr/bin/codium, vscodium-bin) and ~/.config/code-flags.conf (read by /usr/bin/code,
# visual-studio-code-bin). Keep comments on their own lines: codium's wrapper only skips whole-line comments.
#
# Run natively on Wayland instead of through XWayland: sharp text at fractional scale and proper
# Hyprland opacity/blur.
--ozone-platform=wayland
--enable-wayland-ime
--gtk-version=4
--ignore-gpu-blocklist
--enable-features=TouchpadOverscrollHistoryNavigation
# Store sign-in tokens (GitHub, Settings Sync, extension secrets) in the GNOME keyring.
--password-store=gnome-libsecret
